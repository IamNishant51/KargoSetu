name: render-keepalive

# Anti-sleep insurance for the Render free backend (sleeps after 15 min idle).
# Pings the ultra-light /api/health/ping (no DB, no ML) every 10 minutes.
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables ->
# new repository variable RENDER_BACKEND_URL = https://<your-svc>.onrender.com
# (no trailing slash). Then run this workflow once manually to verify.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          test -n "${{ vars.RENDER_BACKEND_URL }}" || { echo "RENDER_BACKEND_URL variable not set"; exit 1; }
          # Render free-tier cold starts take 50-80s; give curl 180s and retries with browser user-agent
          echo "Pinging ultra-light health ping..."
          curl -fsSL \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --connect-timeout 30 \
            --max-time 180 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            "${{ vars.RENDER_BACKEND_URL }}/api/health/ping" || echo "Ping request completed"
          echo
          echo "Checking full health status..."
          curl -fsSL \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --connect-timeout 30 \
            --max-time 120 \
            "${{ vars.RENDER_BACKEND_URL }}/api/health/" | head -c 500 || echo "Full health check finished"
          echo
