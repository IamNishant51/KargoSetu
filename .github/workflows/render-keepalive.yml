name: render-keepalive

# Anti-sleep insurance for the Render free backend (sleeps after 15 min idle).
# Pings the ultra-light /api/health/ping (no DB, no ML) every 10 minutes.
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables ->
# new repository variable RENDER_BACKEND_URL = https://<your-svc>.onrender.com
# (no trailing slash). Then run this workflow once manually to verify.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          test -n "${{ vars.RENDER_BACKEND_URL }}" || { echo "RENDER_BACKEND_URL variable not set"; exit 1; }
          curl -fsS -m 60 "${{ vars.RENDER_BACKEND_URL }}/api/health/ping"
          echo
          curl -fsS -m 90 "${{ vars.RENDER_BACKEND_URL }}/api/health" | head -c 500
          echo
