name: CI

on:
  push:
    branches: [main, nishant]
  pull_request:
    branches: [main]

jobs:
  backend-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff mypy

      - name: Generate Prisma Client
        run: prisma generate
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"

      - name: Push Prisma schema to test database
        run: prisma db push --skip-generate
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"
          DIRECT_URL: "postgresql://test:test@localhost:5432/testdb"

      - name: Lint with Ruff
        run: ruff check app/ tests/

      - name: Type-check with mypy (informational)
        run: mypy app/ --ignore-missing-imports --no-error-summary || true

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -x
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"
          DIRECT_URL: "postgresql://test:test@localhost:5432/testdb"
          JWT_SECRET_KEY: "ci-test-secret-key-minimum-32-chars"
          AISSTREAM_API_KEY: ""
          FIRMS_MAP_KEY: ""
          MARINETRAFFIC_API_KEY: ""
          FRONTEND_URL: "http://localhost:3000"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check i18n parity
        run: npm run check:i18n

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_CESIUM_ION_TOKEN: ""
