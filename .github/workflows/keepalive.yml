name: backend-keepalive

# Free-tier insurance: Hugging Face cpu-basic Spaces sleep after 48h of
# inactivity. This pings /api/health every 10 minutes so the Space never
# idles out. Costs nothing (public repo Actions minutes are free).
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables ->
# new repository variable BACKEND_URL = https://<your-space>.hf.space
# (no trailing slash). Then run this workflow once manually to verify.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          test -n "${{ vars.BACKEND_URL }}" || { echo "BACKEND_URL variable not set"; exit 1; }
          curl -fsS -m 60 "${{ vars.BACKEND_URL }}/api/health" | head -c 500
          echo
