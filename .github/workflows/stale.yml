name: "Triage Stale Issues"
on:
  schedule:
    - cron: "0 0 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been inactive for 60 days and is marked as stale. Please respond or comment, otherwise it will be closed in 14 days.'
          close-issue-message: 'This issue has been closed due to 14 days of continued inactivity after being marked as stale.'
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: 'stale'
