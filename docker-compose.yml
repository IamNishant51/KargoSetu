services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kargodb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d kargodb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:7860"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/kargodb
      JWT_SECRET_KEY: dev-secret-change-in-production
      FRONTEND_URL: http://localhost:3000
    restart: unless-stopped

volumes:
  postgres_data:
